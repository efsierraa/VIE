{% extends "base.html" %}
{% block title %}Mi cuenta — VIE{% endblock %}
{% block content %}
<h1>Mi cuenta</h1>
<section class="card narrow">
  <p class="hint">Sesión de <strong>{{ user.nombre_completo }}</strong> ({{ user.role }}).</p>
  <h2>Cambiar mi clave</h2>
  <form id="pw-form" class="form">
    <label>Clave actual <input type="password" name="actual" required></label>
    <label>Nueva clave <input type="password" name="nueva" required minlength="6"></label>
    <label>Repetir nueva clave <input type="password" name="repetir" required minlength="6"></label>
    <button type="submit">Guardar clave</button>
  </form>
  <p class="hint">Si olvidaste tu clave, administración puede asignarte una nueva.</p>
</section>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById("pw-form");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (data.nueva !== data.repetir) { alert("Las claves nuevas no coinciden"); return; }
  const r = await fetch("/api/me/password", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({actual: data.actual, nueva: data.nueva})});
  const j = await r.json();
  if (r.ok && j.ok) { alert("Clave actualizada."); form.reset(); }
  else alert(j.detail || "Error cambiando la clave");
});
</script>
{% endblock %}
