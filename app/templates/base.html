<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VIE{% endblock %}</title>
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">VIE</a>
  <nav>
    {% if user %}
    <span class="chip role-{{ user.role }}">{{ user.nombre_completo }} · {{ user.role }}</span>
    <a class="link" href="/cuenta">Mi clave</a>
    <a class="link" href="/logout">Salir</a>
    {% endif %}
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="foot">VIE — software libre (MIT) · <a href="/acerca">hecho con amor en 🇨🇴 ❤️</a></footer>
{% if tabs %}
<div class="menu-flotante">
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="fab" title="Menú">
    <span class="fab-abrir">☰</span><span class="fab-cerrar">✕</span>
  </label>
  <nav class="menu-panel">
    {% for t in tabs %}
    <a href="{{ t.url }}" class="{{ 'activa' if t.activa else '' }}">{{ t.nombre }}</a>
    {% endfor %}
    <a href="/acerca">Acerca de</a>
  </nav>
</div>
{% endif %}
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
