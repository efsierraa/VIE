{% extends "base.html" %}
{% block title %}Verificación en dos pasos — VIE{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Verificación en dos pasos</h1>
  <p class="hint">Abre tu app de autenticación e ingresa el código de 6 dígitos. También sirve un código de respaldo.</p>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/2fa" class="form">
    <label>Código <input name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="11" autofocus></label>
    <button type="submit">Verificar</button>
  </form>
</section>
{% endblock %}
