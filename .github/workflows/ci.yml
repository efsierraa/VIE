name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit --desc -r requirements.txt
        # Solo informa: no bloquea el merge, el reporte queda en el log.
        # Para bloquear en alta/crítica, añade: --fix-dry-run? No: usa --vulnerability-service osv
        continue-on-error: true
